# pyrefly config — MOON-AI project
# NOTE: .pyrefly.toml uses top-level keys (not a [pyrefly] table).
# Project module name(s)
module = "moon"

# Source roots to type-check
source = ["app", "moon", "scripts", "tests"]

# Exclude patterns for generated/virtual dirs
exclude = [
    "**/.git",
    "**/node_modules",
    "**/.venv",
    "**/venv",
    "**/build",
    "**/dist",
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.moon_logs",
    "**/.moon_sessions.json",
    "**/.moon_workflow_logs",
    "**/moon_ai_agent.egg-info",
    "**/moon/libnode",
]

python-version = "3.10.0"
preset = "legacy"
ignore-missing-imports = ["*"]

# Pre-existing diagnostics are recorded in the baseline; CI fails on new ones.
baseline = "pyrefly-baseline.json"
baseline-matching-mode = "concise-description"
