name: MOON CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install (editable)
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e .
          # Pin the quality-gate tools so a green run is reproducible
          # (ruff's default rule set and mypy's checks change between releases).
          pip install ruff==0.17.3 mypy==2.4.0 pytest==9.1.1
      - name: Lint (ruff)
        run: ruff check app scripts tests
      - name: Typecheck (mypy)
        run: mypy app
      - name: Test
        run: python -m pytest tests -q
